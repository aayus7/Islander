[package]
name = "dynamic-island"
version = "0.9.5"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/aayus7/Islander"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tungstenite = "0.30"
socket2 = { version = "0.6", features = ["all"] } # LocalSend multicast discovery
# LocalSend's encrypted connections (phones require a client certificate)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
jpeg-encoder = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] } # reads Windows' notification database (sender avatars)
cpal = "0.18"
# Screen recording: Windows.Graphics.Capture + hardware H.264 (MIT; vendored with two small additions)
windows-capture = { path = "vendor/windows-capture" }
png = "0.18"
windows-core = "0.61" # needed by the #[interface] macro (IPolicyConfig)
windows-collections = "0.2" # IIterable for WinRT device queries
realfft = "3.5"
windows-future = "0.2" # async WinRT types (IAsyncOperation) the windows crate returns
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Foundation",
  "Foundation_Collections",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Media_Control",
  "Media_SpeechRecognition",
  "Storage",
  "Storage_FileProperties",
  "Storage_Search",
  "Storage_Streams",
  "Web",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_SystemServices",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Magnification",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug", # crash notes and dumps (crashlog.rs)
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility", # watching for Windows' volume popup (takeover.rs)
  "Devices_WiFi",
  "Devices_Radios",
  "Devices_Bluetooth",
  "Networking_Connectivity",
  "Security_Credentials",
  "Win32_Media_KernelStreaming",
  "Win32_System_Wmi",
  "Win32_Devices_Display",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
